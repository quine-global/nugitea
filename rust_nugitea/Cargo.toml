[package]
name = "rust_nugitea"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_nugitea"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
russh = "0.63"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
rand = "0.10"
anyhow = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
shlex = "1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "query"] }
leptos = { version = "0.8", features = ["ssr"] }
